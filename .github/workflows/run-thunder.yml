name: Run Thunder Script

# The workflow_dispatch event allows you to manually trigger the script from the Actions tab
on: 
  workflow_dispatch: 

jobs:
  run-python-script:
    runs-on: ubuntu-latest #
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 #
        
      - name: Set up Python
        uses: actions/setup-python@v5 #
        with:
          python-version: '3.10' #
          
      - name: Install dependencies
        run: pip install requests cryptography
        
      - name: Run Python script
        run: python thundermkc.py #
